syntax = "proto3";

package dexlineage.fixture;
option java_package = "dev.dexlineage.fixture.proto";
option java_multiple_files = true;
option java_outer_classname = "FixtureMessages";

message CredentialMessage {
  string token = 1;
  int64 epoch = 2;
}
message MemberMessage {
  string identity = 1;
  string unrelated_label = 3;
}
message ParentMessage {
  // Source order and field names change; wire tags and message roles remain fixed.
  repeated MemberMessage identity_nodes = 2;
  bool feature_enabled = 9;
  CredentialMessage backup_authorization = 3;
  CredentialMessage authorization_context = 1;
  string fixture_parent_anchor = 100;
}
message MapParent {
  string fixture_map_anchor = 100;
  map<string, MemberMessage> renamed_entries = 1;
}
message OneofParent {
  string fixture_oneof_anchor = 100;
  oneof renamed_payload {
    CredentialMessage renamed_credential = 1;
    MemberMessage renamed_member = 2;
  }
}
